name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test

  # Sicurezza del backend: lo schema Supabase viene caricato su un Postgres vero
  # e provato come ruolo "anon" (isolamento tra giocatori e campagne, token, merge).
  sql:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Schema + test di sicurezza
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/prepare.sql -f supabase/schema.sql -f supabase/tests/security.sql
      - name: Lo schema è rieseguibile (idempotente)
        run: psql -v ON_ERROR_STOP=1 -q -f supabase/schema.sql
      - name: Aggiornamento da una versione precedente (nessun vecchio overload superstite)
        run: |
          psql -v ON_ERROR_STOP=1 -q -c "drop schema public cascade; create schema public;"
          psql -v ON_ERROR_STOP=1 -f supabase/tests/prepare.sql -f supabase/tests/legacy.sql -f supabase/schema.sql -f supabase/tests/security.sql
